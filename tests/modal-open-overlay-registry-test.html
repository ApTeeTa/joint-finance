<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тесты: open modal registry (overlay only)</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; }
    .pass { color: green; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h1>Modal open registry — overlay only</h1>
  <div id="modal-root"></div>
  <pre id="out"></pre>
  <script type="module">
    import {
      relocateModals,
      openModal,
      closeModal,
      getOpenModalNames
    } from '../src/modules/modalLayer.js';

    const out = document.getElementById('out');
  let fail = 0;

    function log(line, cls = '') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = line;
      out.appendChild(div);
    }

    function assert(c, m) {
      if (!c) throw new Error(m);
    }

    function run(name, fn) {
      try {
        fn();
        log(`PASS  ${name}`, 'pass');
      } catch (e) {
        fail += 1;
        log(`FAIL  ${name}: ${e.message}`, 'fail');
      }
    }

    const tab = document.createElement('div');
    tab.id = 'tab-content';
    document.body.appendChild(tab);
    tab.innerHTML = `
      <div data-modal="spend-saving" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/35">
        <form data-form="spend-saving"><input name="amount" value=""></form>
        <button type="button" data-action="close-modal" data-modal="spend-saving">Отмена</button>
      </div>
      <div data-modal="deposit-saving" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/35">
        <form data-form="deposit-saving"></form>
        <button type="button" data-action="close-modal" data-modal="deposit-saving">Отмена</button>
      </div>
    `;
    relocateModals(tab);

    run('only open overlay counted, not cancel buttons', () => {
      openModal('spend-saving');
      const names = getOpenModalNames();
      assert(names.length === 1, `expected 1 open modal, got ${names.length}: ${names.join(', ')}`);
      assert(names[0] === 'spend-saving', 'spend-saving open');
      closeModal('spend-saving');
      assert(getOpenModalNames().length === 0, 'closed');
    });

    run('closed overlays do not register cancel buttons', () => {
      assert(getOpenModalNames().length === 0, 'none open');
    });

    if (fail === 0) log('ALL PASSED', 'pass');
    else log(`FAILURES: ${fail}`, 'fail');
  </script>
</body>
</html>
