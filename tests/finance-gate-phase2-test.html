<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Тесты: Phase 2 Gate Completion</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    .pass { color: green; }
    .fail { color: red; }
    .info { color: #555; }
  </style>
</head>
<body>
  <h1>Phase 2 — lifecycle actions via actionRegistry</h1>
  <pre id="out"></pre>
  <script type="module">
    import { calculateFreeBalance } from '../src/modules/financeEngine.js';
    import { dispatch, ACTION_TYPES, isImplementedActionType } from '../src/modules/actionRegistry.js';
    import { reserveObligation } from '../src/modules/financeGate.js';
    import { todayIso } from '../src/modules/transactions.js';

    const out = document.getElementById('out');
    const results = {};

    function log(line, cls = '') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = line;
      out.appendChild(div);
    }
    function assert(c, m) { if (!c) throw new Error(m); }

    function baseState() {
      return {
        profile: 'husband',
        exchangeRate: 92,
        accounts: [{ id: 'acc', name: 'A', currency: 'RUB', balance: 100000, owner: 'husband' }],
        categories: [{ id: 'food', name: 'Еда', limit: 50000, reserved: 5000, spent: 0 }],
        obligations: [],
        savings: [],
        debts: [],
        transactions: []
      };
    }

    async function run(name, key, fn) {
      try {
        await fn();
        results[key] = 'PASS';
        log(`PASS  ${name}`, 'pass');
      } catch (e) {
        results[key] = 'FAIL';
        log(`FAIL  ${name}: ${e.message}`, 'fail');
      }
    }

    await run('TEST 0 — all lifecycle types implemented', 'test0', () => {
      const pending = Object.values(ACTION_TYPES).filter((type) => !isImplementedActionType(type));
      assert(pending.length === 0, `pending types: ${pending.join(', ')}`);
    });

    await run('TEST 1 — CATEGORY_CREATE via dispatch', 'test1', () => {
      const state = baseState();
      const result = dispatch({
        type: ACTION_TYPES.CATEGORY_CREATE,
        payload: { state, name: 'Транспорт', limit: 10000, author: 'husband' },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(state.categories.some((c) => c.name === 'Транспорт'), 'category pushed');
      assert(result.entity?.id, 'entity returned');
    });

    await run('TEST 2 — CATEGORY_UPDATE via dispatch', 'test2', () => {
      const state = baseState();
      const result = dispatch({
        type: ACTION_TYPES.CATEGORY_UPDATE,
        payload: {
          state,
          categoryId: 'food',
          name: 'Продукты',
          limit: 60000,
          author: 'husband'
        },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(state.categories[0].name === 'Продукты', 'name updated');
      assert(state.categories[0].limit === 60000, 'limit updated');
    });

    await run('TEST 3 — CATEGORY_DELETE removes entity', 'test3', () => {
      const state = baseState();
      const category = state.categories[0];
      const freeBefore = calculateFreeBalance(state);
      const result = dispatch({
        type: ACTION_TYPES.CATEGORY_DELETE,
        payload: { state, category, author: 'husband' },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(!state.categories.find((c) => c.id === 'food'), 'category removed');
      assert(calculateFreeBalance(state) === freeBefore + 5000, 'reserved returned to free');
    });

    await run('TEST 4 — OBLIGATION_CREATE via dispatch', 'test4', () => {
      const state = baseState();
      const result = dispatch({
        type: ACTION_TYPES.OBLIGATION_CREATE,
        payload: {
          state,
          data: { name: 'Интернет', paidUntil: '2026-12-01', targetAmount: 1500 },
          author: 'husband'
        },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(state.obligations.length === 1, 'obligation pushed');
      assert(result.transaction?.type === 'obligation_created', 'journal tx');
    });

    await run('TEST 5 — OBLIGATION_UPDATE via dispatch', 'test5', () => {
      const state = baseState();
      state.obligations = [{
        id: 'obl',
        name: 'Интернет',
        reserveAmount: 0,
        paidUntil: '2026-06-01',
        status: 'active',
        payments: [],
        createdAt: new Date().toISOString()
      }];
      const result = dispatch({
        type: ACTION_TYPES.OBLIGATION_UPDATE,
        payload: {
          state,
          obligationId: 'obl',
          data: { name: 'Интернет+TV', paidUntil: '2026-07-01' },
          author: 'husband'
        },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(state.obligations[0].name === 'Интернет+TV', 'name updated');
    });

    await run('TEST 6 — OBLIGATION_DELETE releases reserve', 'test6', () => {
      const state = baseState();
      state.obligations = [{
        id: 'obl',
        name: 'Интернет',
        reserveAmount: 0,
        paidUntil: '2026-06-01',
        status: 'active',
        payments: [],
        createdAt: new Date().toISOString()
      }];
      reserveObligation(state, 'obl', 3000, '', todayIso(), 'husband');
      const freeBefore = calculateFreeBalance(state);
      const result = dispatch({
        type: ACTION_TYPES.OBLIGATION_DELETE,
        payload: { state, obligationId: 'obl', author: 'husband' },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(state.obligations.length === 0, 'obligation removed');
      assert(calculateFreeBalance(state) === freeBefore + 3000, 'reserve released');
      assert(
        state.transactions.some((tx) => tx.type === 'obligation_unreserve'),
        'unreserve tx present'
      );
      assert(
        state.transactions.some((tx) => tx.type === 'obligation_deleted'),
        'delete tx present'
      );
    });

    await run('TEST 7 — RATE_UPDATE via dispatch', 'test7', () => {
      const state = baseState();
      const result = dispatch({
        type: ACTION_TYPES.RATE_UPDATE,
        payload: { state, exchangeRate: 95.5, author: 'husband' },
        meta: { source: 'phase2-test' }
      });
      assert(result.ok, result.error);
      assert(state.exchangeRate === 95.5, 'rate updated');
      assert(result.transaction?.type === 'exchange_rate_updated', 'journal tx');
    });

    const failed = Object.values(results).filter((v) => v === 'FAIL').length;
    log('', 'info');
    log(failed ? `Итого: ${failed} FAIL` : 'Итого: все тесты PASS', failed ? 'fail' : 'pass');
  </script>
</body>
</html>
