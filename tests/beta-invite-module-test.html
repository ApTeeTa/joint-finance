<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tests: Beta B2 Invite</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; }
    .pass { color: green; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h1>Beta B2 — invite module</h1>
  <pre id="out"></pre>
  <script type="module">
    import {
      getOrCreateInviteCode,
      getHouseholdMemberStats
    } from '../src/lib/householdService.js';

    const out = document.getElementById('out');
    function log(line, cls = '') {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = line;
      out.appendChild(div);
    }
    function assert(c, m) { if (!c) throw new Error(m); }

    try {
      assert(typeof getOrCreateInviteCode === 'function', 'getOrCreateInviteCode');
      assert(typeof getHouseholdMemberStats === 'function', 'getHouseholdMemberStats');
      log('PASS  Beta B2 household invite exports', 'pass');
      log('Total: PASS', 'pass');
    } catch (e) {
      log('FAIL  ' + e.message, 'fail');
    }
  </script>
</body>
</html>
